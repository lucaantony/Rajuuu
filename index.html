<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Pink Car Runner</title>
<style>
:root{--bg:#f4f1ea;--ink:#222;--panel:#fff;--muted:#666;--acc:#e8541e;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#1c1c1e;--ink:#eee;--panel:#2a2a2d;--muted:#aaa}}
:root[data-theme="dark"]{--bg:#1c1c1e;--ink:#eee;--panel:#2a2a2d;--muted:#aaa}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--ink);overflow:hidden;touch-action:none;user-select:none;-webkit-user-select:none;-webkit-tap-highlight-color:transparent;font-family:"Courier New",ui-monospace,monospace;position:relative}
canvas{display:block;width:100%;height:100%}
.ov{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;padding:20px;box-sizing:border-box}
.ov.hide{display:none}
.card{background:var(--panel);border:3px solid var(--ink);padding:24px;max-width:320px;width:100%;text-align:center}
h1{margin:0 0 8px;font-size:1.9rem}
p{margin:8px 0;color:var(--muted);line-height:1.4;font-size:.95rem}
button,label.btn{display:inline-block;box-sizing:border-box;font:inherit;font-weight:700;border:3px solid var(--ink);background:var(--acc);color:#fff;padding:12px 24px;margin:8px 0 0;cursor:pointer;min-width:180px}
label.btn{background:transparent;color:var(--ink);font-size:.9rem;padding:9px 16px}
button:active{transform:translateY(2px)}
#prev{width:200px;max-width:80%;height:auto;display:block;margin:10px auto 0}
#mute{position:absolute;top:calc(10px + env(safe-area-inset-top,0px));right:10px;min-width:0;width:44px;height:44px;padding:0;margin:0;background:var(--panel);color:var(--ink);font-size:1.2rem}
</style>
</head>
<body>
<canvas id="cv"></canvas>
<button id="mute" aria-label="Toggle sound">🔊</button>

<div id="start" class="ov">
  <div class="card">
    <h1>Pink Car Runner</h1>
    <p>Tap to jump. Swipe down to duck. Keep the car off the cacti.</p>
    <img id="prev" alt="Your car">
    <p>Best: <b id="b0">0</b></p>
    <button id="play">Start</button>
    <p style="font-size:.75rem">Keyboard: Space / ↑ jump, ↓ duck</p>
  </div>
</div>

<div id="over" class="ov hide">
  <div class="card">
    <h1>Game over</h1>
    <p style="font-size:2.4rem;color:var(--ink);margin:4px 0" id="fin">0</p>
    <p>Best: <b id="b1">0</b> <span id="nb" style="color:var(--acc)"></span></p>
    <button id="again">Restart</button>
  </div>
</div>

/* sizing */
function resize(){
  const d=Math.min(devicePixelRatio||1,2);W=cv.clientWidth;H=cv.clientHeight;
  cv.width=W*d;cv.height=H*d;ctx.setTransform(d,0,0,d,0,0);
  G=H*.72;U=Math.max(14,Math.min(W*.075,H*.052));
}
addEventListener('resize',resize);addEventListener('orientationchange',()=>setTimeout(resize,150));

/* player */
const P={y:0,vy:0,duck:false,x:0,leg:0};
const RATIO=1.1028;function pw(){return U*3.8}
function ph(){return pw()/RATIO*(P.duck?.6:1)}
function jump(){if(state!=='play')return;if(P.y>=0&&!P.duck){P.vy=-U*24;play('jump')}}
let ty=null;
cv.addEventListener('pointerdown',e=>{ty=e.clientY;jump()});
cv.addEventListener('pointermove',e=>{if(ty!==null&&e.clientY-ty>30&&state==='play'){P.duck=true;if(P.y<0)P.vy=Math.max(P.vy,U*10)}});
const up=()=>{ty=null;P.duck=false};
cv.addEventListener('pointerup',up);cv.addEventListener('pointercancel',up);
addEventListener('keydown',e=>{
  if(e.key===' '||e.key==='ArrowUp'){e.preventDefault();if(state==='start')startGame();else if(state==='over'&&!$('over').classList.contains('hide'))startGame();else jump()}
  if(e.key==='ArrowDown')P.duck=true;
});
addEventListener('keyup',e=>{if(e.key==='ArrowDown')P.duck=false});
document.addEventListener('contextmenu',e=>e.preventDefault());
$('mute').onclick=()=>{initAudio();muted=!muted;$('mute').textContent=muted?'🔇':'🔊'};
$('play').onclick=startGame;$('again').onclick=startGame;

function startGame(){
  initAudio();score=0;dist=0;objs=[];nextT=1;P.y=0;P.vy=0;P.duck=false;speed=W*.55;state='play';
  clouds=[];for(let i=0;i<4;i++)clouds.push({x:Math.random()*W,y:H*(.1+Math.random()*.25),s:.5+Math.random()});
  $('start').classList.add('hide');$('over').classList.add('hide');
}
function die(){
  state='dying';play('die');
  const nb=score>best;if(nb){best=score;try{localStorage.setItem('fr-best',best)}catch(e){}}
  setTimeout(()=>{$('fin').textContent=score;$('b1').textContent=best;$('b0').textContent=best;$('nb').textContent=nb&&score>0?'New best!':'';$('over').classList.remove('hide');state='over'},900);
}
function spawn(){
  const bird=score>250&&Math.random()<.3;
  if(bird){const hi=Math.random()<.5;objs.push({k:'b',x:W+U,w:U*1.6,h:U*1,y:hi?G-U*2.3:G-U*.9-U*1})}
  else{const n=1+(Math.random()<.35?1:0)+(Math.random()<.15?1:0),h=U*(1.1+Math.random()*1.0);objs.push({k:'c',x:W+U,w:U*.7*n+U*.3*(n-1),h,n,y:G-h})}
}

function update(dt){
  if(state==='play'){
    speed=Math.min(W*1.5,speed+dt*W*.012);dist+=speed*dt;score=Math.floor(dist/ (U*.9));
    P.vy+=U*42*dt;P.y+=P.vy*dt;if(P.y>=0){P.y=0;P.vy=0}
    nextT-=dt;if(nextT<=0){spawn();nextT=(U*8+Math.random()*U*10)/speed+.25}
    P.leg+=dt*speed/U*.9;
    const px=W*.16,ph_=ph(),pw_=pw()*.66,pt=G+P.y-ph_,pl=px-pw_/2;
    for(const o of objs){
      const ox=o.x+ (o.w*.12),ow=o.w*.76,oy=o.y+o.h*.1,oh=o.h*.8;
      if(pl+pw_>ox&&pl<ox+ow&&pt+ph_*.05+ph_*.9>oy&&pt+ph_*.05<oy+oh){die();break}
    }
  }
  if(state==='play')for(const o of objs)o.x-=speed*dt*(o.k==='b'?1.25:1);
  objs=objs.filter(o=>o.x>-U*4);
  for(const c of clouds){c.x-=speed*dt*.15*(c.s);if(c.x<-U*4){c.x=W+U*2;c.y=H*(.1+Math.random()*.25)}}
}
function drawPlayer(){
  const px=W*.16,w=pw(),h=ph();
  ctx.save();ctx.globalAlpha=.18;ctx.fillStyle='#000';ctx.beginPath();ctx.ellipse(px,G+4,w*.42*(1-Math.min(.4,-P.y/(U*12))),U*.18,0,0,6.283);ctx.fill();ctx.restore();
  if(car.complete&&car.naturalWidth){const b=P.y<0||state!=='play'?0:Math.abs(Math.sin(dist/(U*1.2)))*U*.06;ctx.drawImage(car,px-w/2,G+P.y-h-b,w,h)}
}
function draw(){
  const ink=getComputedStyle(document.body).color;
  ctx.clearRect(0,0,W,H);ctx.fillStyle=ink;ctx.strokeStyle=ink;
  ctx.globalAlpha=.18;for(const c of clouds){ctx.fillRect(c.x,c.y,U*2.2*c.s,U*.4);ctx.fillRect(c.x+U*.5*c.s,c.y-U*.3,U*1.2*c.s,U*.3)}ctx.globalAlpha=1;
  ctx.lineWidth=3;ctx.beginPath();ctx.moveTo(0,G);ctx.lineTo(W,G);ctx.stroke();
  ctx.globalAlpha=.4;for(let x=-(dist%60);x<W;x+=60)ctx.fillRect(x,G+8,14,3);ctx.globalAlpha=1;
  for(const o of objs){
    if(o.k==='c'){
      const cw=o.w/o.n;for(let i=0;i<o.n;i++){
        const x=o.x+i*(cw+U*.3);ctx.fillStyle='#2f8f4e';ctx.fillRect(x,o.y,cw,o.h);ctx.fillRect(x-cw*.7,o.y+o.h*.35,cw*.7,cw*.45);ctx.fillRect(x-cw*.7,o.y+o.h*.2,cw*.45,o.h*.25);
        ctx.fillRect(x+cw,o.y+o.h*.5,cw*.7,cw*.45);ctx.fillRect(x+cw+cw*.25,o.y+o.h*.3,cw*.45,o.h*.25);
      }
    }else{
      ctx.fillStyle='#8a5cc2';const f=Math.floor(dist/40)%2;
      ctx.fillRect(o.x,o.y+o.h*.3,o.w,o.h*.4);ctx.fillRect(o.x-o.w*.25,o.y+o.h*.4,o.w*.3,o.h*.2);
      ctx.fillRect(o.x+o.w*.25,f?o.y-o.h*.3:o.y+o.h*.7,o.w*.5,o.h*.5);
    }
  }
  drawPlayer();
  ctx.fillStyle=ink;ctx.font='700 '+Math.round(U*.9)+'px "Courier New",monospace';ctx.textAlign='right';ctx.textBaseline='top';
  if(state==='play'||state==='dying'||state==='over'){ctx.fillText('HI '+String(best).padStart(5,'0')+'  '+String(score).padStart(5,'0'),W-Math.max(64,U*3.4)-6,16)}
}
function frame(t){const dt=Math.min(.05,(t-last)/1000||0);last=t;update(dt);draw();requestAnimationFrame(frame)}
resize();requestAnimationFrame(t=>{last=t;frame(t)});
})();
</script>
